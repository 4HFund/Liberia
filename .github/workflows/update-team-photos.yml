name: Update team photos and hide public progress

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/update-team-photos.yml

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update team portraits and remove public totals
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          text, count = re.subn(
              r'''    \.hero-top \{\n      display: grid;\n      grid-template-columns: minmax\(0, 1\.2fr\) minmax\(320px, 0\.68fr\);\n      gap: clamp\(38px, 7vw, 92px\);\n      align-items: end;\n    \}''',
              '''    .hero-top {
      display: block;
      max-width: 900px;
    }''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit('Hero layout target not found')

          text, count = re.subn(
              r'''\n    \.progress-card \{.*?\n    \.trailer-block \{''',
              '''\n    .trailer-block {''',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Progress CSS target not found')

          old_portrait_css = '''    .bio-portrait {
      position: relative;
      display: grid;
      place-items: center;
      overflow: hidden;
      background: linear-gradient(145deg, var(--forest-900), var(--forest-700));
      color: #fff;
    }
    .bio-portrait::before {
      content: "";
      position: absolute;
      inset: -20%;
      opacity: 0.14;
      background: url("assets/cacao-cross.svg") center / 78% no-repeat;
      transform: rotate(-7deg);
    }
    .bio-portrait span {
      position: relative;
      font-family: "Fraunces", serif;
      font-size: 3.2rem;
      font-weight: 700;
    }
'''
          new_portrait_css = '''    .bio-portrait {
      position: relative;
      overflow: hidden;
      min-height: 360px;
      background: var(--forest-900);
    }
    .bio-portrait img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
    .bio-card.sidney-card .bio-portrait img {
      object-fit: contain;
      object-position: center;
      background: var(--forest-900);
    }
    .bio-portrait::after {
      content: "";
      position: absolute;
      inset: 48% 0 0;
      pointer-events: none;
      background: linear-gradient(transparent, rgba(6, 23, 17, 0.82));
    }
    .portrait-caption {
      position: absolute;
      z-index: 2;
      left: 16px;
      right: 16px;
      bottom: 14px;
      color: #fff;
      font-size: 0.78rem;
      font-weight: 800;
      letter-spacing: 0.04em;
    }
'''
          if old_portrait_css not in text:
              raise SystemExit('Portrait CSS target not found')
          text = text.replace(old_portrait_css, new_portrait_css, 1)

          text = text.replace('      .progress-card { max-width: 650px; }\n', '')
          text = text.replace('      .progress-card { padding: 24px; }\n', '')
          text = text.replace('      .bio-portrait { min-height: 150px; }', '      .bio-portrait { min-height: 290px; }')

          text, count = re.subn(
              r'''\n        <aside class="progress-card" aria-label="Fundraising progress">.*?</aside>''',
              '',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('Progress card target not found')

          old_bobby = '<div class="bio-portrait" aria-label="Pastor Bobby Westfall identity panel"><span>BW</span></div>'
          new_bobby = '''<div class="bio-portrait">
              <img src="assets/IMG_2452.jpeg" alt="Pastor Bobby Westfall" loading="lazy" decoding="async">
              <span class="portrait-caption">Pastor Bobby Westfall</span>
            </div>'''
          if old_bobby not in text:
              raise SystemExit('Pastor Bobby portrait target not found')
          text = text.replace(old_bobby, new_bobby, 1)

          old_sidney = '''<article class="bio-card">
            <div class="bio-portrait" aria-label="Sidney Mozingo identity panel"><span>SM</span></div>'''
          new_sidney = '''<article class="bio-card sidney-card">
            <div class="bio-portrait">
              <img src="assets/IMG_3063.png" alt="Sidney Mozingo with his wife, Jacy Mozingo" loading="lazy" decoding="async">
              <span class="portrait-caption">Sidney &amp; Jacy Mozingo</span>
            </div>'''
          if old_sidney not in text:
              raise SystemExit('Sidney portrait target not found')
          text = text.replace(old_sidney, new_sidney, 1)

          old_copy = '''<p>Sidney will lead cinematography, photography, audio, and post-production. His focus is to build a film with context and excellence—one that protects dignity, centers Liberian voices, and gives churches and partners meaningful media for years to come.</p>'''
          new_copy = '''<p>Sidney will lead cinematography, photography, audio, and post-production. Pictured with his wife, Jacy, he approaches this mission with the support of his family and a commitment to build a film with context and excellence—one that protects dignity, centers Liberian voices, and gives churches and partners meaningful media for years to come.</p>'''
          if old_copy not in text:
              raise SystemExit('Sidney bio copy target not found')
          text = text.replace(old_copy, new_copy, 1)

          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/update-team-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/update-team-photos.yml
          git commit -m "Add real team portraits and hide public fundraising totals"
          git push
