name: Add real Liberia mission photos
# Trigger the one-time site update now that the workflow exists on main.

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/add-real-liberia-photos.yml

permissions:
  contents: write

jobs:
  update-site:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Add optimized mission photographs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets

          download_blob() {
            gh api "repos/${GITHUB_REPOSITORY}/git/blobs/$1" --jq '.content' | tr -d '\n' | base64 --decode > "$2"
          }

          download_blob 8c3207aaa9bda945c1f4cfd90b204414687a333a assets/liberia-map.webp
          download_blob cb9f00f22bc0f74feed757ef97cc87d67ce3346a assets/liberia-family-transport.webp
          download_blob 942c9eeb288ea964e054f9ed1385ba8462e4085d assets/liberia-church-leaders.webp
          download_blob bab1ccb467ec0a35d91839d30e10158f4f6c2d63 assets/liberia-church-gathering.jpg

          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          old_story = '<figure class="story-photo"><img data-parallax="0.04" src="https://upload.wikimedia.org/wikipedia/commons/0/04/Ganta%2C_Liberia_-_panoramio.jpg" alt="Green rice fields and countryside near Ganta, Liberia" loading="lazy" decoding="async"><figcaption class="photo-label">Ganta, Liberia · A landscape shaped by agriculture, community, and possibility.</figcaption></figure>'
          new_story = '<figure class="story-photo"><img src="assets/liberia-church-leaders.webp" alt="Liberian church leaders and ministry partners standing together outside a developing church property" loading="lazy" decoding="async" width="420" height="315"><figcaption class="photo-label">Real ministry partners in Liberia · Local leaders building the church and its future together.</figcaption></figure>'
          if old_story not in text:
              raise SystemExit('Story photograph target was not found')
          text = text.replace(old_story, new_story, 1)

          gallery = '''<section class="section image-story" aria-labelledby="liberia-gallery-title"><div class="wrap"><div class="eyebrow reveal">Real Images from Liberia</div><h2 class="section-title reveal" id="liberia-gallery-title">The people and places behind the mission.</h2><p class="section-copy reveal" style="max-width:760px;margin-bottom:30px">These photographs come directly from Liberia and offer a genuine glimpse of the families, church leaders, gatherings, and geography connected to this story.</p><p class="swipe-hint">Swipe to explore the photographs →</p><div class="photo-grid real-photo-grid">
            <figure class="photo-card map-card reveal"><img src="assets/liberia-map.webp" alt="Satellite political map of Liberia showing counties, cities, rivers, Monrovia, and neighboring countries" loading="lazy" decoding="async" width="420" height="236"><figcaption class="photo-caption"><strong>Where the story unfolds</strong><span>Liberia’s counties, communities, rivers, and capital city of Monrovia.</span></figcaption></figure>
            <figure class="photo-card reveal"><img src="assets/liberia-family-transport.webp" alt="A Liberian family traveling together in a local vehicle" loading="lazy" decoding="async" width="420" height="315"><figcaption class="photo-caption"><strong>Community in motion</strong><span>A real glimpse of family and everyday life in Liberia.</span></figcaption></figure>
            <figure class="photo-card reveal"><img src="assets/liberia-church-leaders.webp" alt="Liberian church leaders and ministry partners standing together outside a church building" loading="lazy" decoding="async" width="420" height="315"><figcaption class="photo-caption"><strong>Leaders building together</strong><span>Pastors and ministry partners gathered around a growing place of worship.</span></figcaption></figure>
            <figure class="photo-card reveal"><img src="assets/liberia-church-gathering.jpg" alt="A church gathering seated inside a developing worship space in Liberia" loading="lazy" decoding="async" width="240" height="180"><figcaption class="photo-caption"><strong>Faith gathered in community</strong><span>Worship, teaching, and leadership continuing while the church space grows around them.</span></figcaption></figure>
          </div></div></section>'''
          pattern = r'<section class="section image-story" aria-labelledby="liberia-gallery-title">.*?</section>'
          text, count = re.subn(pattern, gallery, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Photo gallery target was not found')

          replacements = {
              'src="https://upload.wikimedia.org/wikipedia/commons/5/58/Monrovia%2C_Liberia_-_panoramio_%2820%29.jpg" alt="A wide city view of Monrovia, Liberia"': 'src="assets/liberia-map.webp" alt="Political map of Liberia highlighting Monrovia and the country’s counties"',
              'src="https://upload.wikimedia.org/wikipedia/commons/c/c0/Liberia%2C_west_africa_2014_-_panoramio_%282%29.jpg" alt="A Methodist church building in Liberia"': 'src="assets/liberia-church-gathering.jpg" alt="A real church gathering inside a developing worship space in Liberia"',
              'src="https://upload.wikimedia.org/wikipedia/commons/4/4c/Cocoa_farm_006.jpg" alt="Cacao growing on an agricultural property"': 'src="assets/liberia-church-leaders.webp" alt="Liberian church leaders and ministry partners at a developing property"',
              'src="https://upload.wikimedia.org/wikipedia/commons/0/04/Ganta%2C_Liberia_-_panoramio.jpg" alt="Green Liberian countryside representing the story brought home"': 'src="assets/liberia-family-transport.webp" alt="A Liberian family representing the people whose stories will be carried home"',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Journey image target was not found: {old}')
              text = text.replace(old, new, 1)

          extra_css = '''
    .real-photo-grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(2,minmax(300px,1fr))}
    .real-photo-grid .photo-card,.real-photo-grid .photo-card:first-child{grid-row:auto;min-height:340px}
    .real-photo-grid .photo-card img{height:100%;object-fit:cover;transform:none}
    .real-photo-grid .map-card img{height:100%;object-fit:contain;background:#0b2a32}
    @media(max-width:760px){
      .real-photo-grid{width:calc(100vw - 14px);display:flex;grid-template-columns:none;grid-template-rows:none;gap:14px;overflow-x:auto;padding:0 14px 10px 0;scroll-snap-type:x mandatory;scrollbar-width:none}
      .real-photo-grid::-webkit-scrollbar{display:none}
      .real-photo-grid .photo-card,.real-photo-grid .photo-card:first-child{flex:0 0 82vw;min-height:330px;scroll-snap-align:start}
    }
'''
          text = text.replace('  </style>', extra_css + '  </style>', 1)
          path.write_text(text, encoding='utf-8')
          PY

          rm .github/workflows/add-real-liberia-photos.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets .github/workflows/add-real-liberia-photos.yml
          git commit -m "Add real Liberia mission photography"
          git push
